# Runs terraform plan on PRs touching infra (mirror of LegalSifter's service-plan)
name: Infra Plan

on:
  pull_request:
    branches: [main]
    paths:
      - "infra/environments/**"
  workflow_dispatch:

permissions:
  id-token: write # OIDC token for Azure
  contents: read
  pull-requests: write # plan comment on the PR

env:
  TF_VERSION: "1.15.1"
  # OIDC auth for the azurerm provider + backend: GitHub's token is exchanged
  # for an Azure token — no stored credentials anywhere.
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  plan:
    name: Plan dev
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Terraform Format
        id: fmt
        run: terraform fmt -check -recursive
        continue-on-error: true

      - name: Terraform Init
        id: init
        run: terraform init -input=false

      - name: Terraform Validate
        id: validate
        run: terraform validate -no-color

      - name: Terraform Plan
        id: plan
        run: terraform plan -no-color -input=false 2>&1 | tee plan.txt
        continue-on-error: true

      - name: Post PR Comment
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let plan = 'Plan output not available';
            try {
              plan = fs.readFileSync('infra/environments/dev/plan.txt', 'utf8');
            } catch (e) {}
            if (plan.length > 60000) plan = plan.substring(0, 60000) + '\n... (truncated)';

            const marker = '<!-- tf-plan: dev -->';
            const body = `${marker}
            ## Terraform Plan — \`dev\`

            | Step | Status |
            |------|--------|
            | Format | ${{ steps.fmt.outcome == 'success' && '✅' || '⚠️' }} |
            | Init | ${{ steps.init.outcome == 'success' && '✅' || '❌' }} |
            | Validate | ${{ steps.validate.outcome == 'success' && '✅' || '❌' }} |
            | Plan | ${{ steps.plan.outcome == 'success' && '✅' || '❌' }} |

            <details><summary>Show Full Plan</summary>

            \`\`\`hcl
            ${plan}
            \`\`\`

            </details>`;

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(c => c.body.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner, repo: context.repo.repo,
                comment_id: existing.id, body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner, repo: context.repo.repo,
                issue_number: context.issue.number, body,
              });
            }

      - name: Check Plan Status
        if: steps.plan.outcome == 'failure'
        run: exit 1
