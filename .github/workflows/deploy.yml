# Merge pipeline: runs on every merge to main, in strict order —
# 1) terraform apply (infra), 2) build images, 3) deploy apps.
# main is a protected branch, so the only way to reach this is through a PR.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # OIDC token for Azure

env:
  TF_VERSION: "1.15.1"
  ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
  ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
  ARM_USE_OIDC: "true"

jobs:
  infra:
    name: Terraform Apply dev
    runs-on: ubuntu-latest
    concurrency:
      group: infra-apply-dev
      cancel-in-progress: false
    defaults:
      run:
        working-directory: infra/environments/dev

    steps:
      - uses: actions/checkout@v4

      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Terraform Init
        run: terraform init -input=false

      - name: Terraform Plan
        run: |
          echo "## Terraform Plan — dev" >> $GITHUB_STEP_SUMMARY
          terraform plan -no-color -input=false -out=tfplan | tee -a $GITHUB_STEP_SUMMARY

      - name: Terraform Apply
        run: terraform apply -input=false tfplan

  build-push:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        service: [api, frontend]
    steps:
      - uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: ./${{ matrix.service }}
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}

  deploy:
    name: Deploy apps
    # Infra must be applied BEFORE the apps that run on it are updated.
    needs: [infra, build-push]
    runs-on: ubuntu-latest
    steps:
      - name: Azure login (OIDC, no stored secrets)
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Update container apps to this commit's images
        env:
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: |
          az config set extension.use_dynamic_install=yes_without_prompt

          # Model credentials as a container-app secret (interim until Key Vault).
          AGENT_ENV=""
          if [ -n "$NVIDIA_API_KEY" ]; then
            az containerapp secret set -n docchat-api -g AgenticRAG \
              --secrets nvidia-api-key="$NVIDIA_API_KEY" -o none
            AGENT_ENV="--set-env-vars NVIDIA_API_KEY=secretref:nvidia-api-key"
          fi

          az containerapp update -n docchat-api -g AgenticRAG \
            --image ghcr.io/${{ github.repository }}-api:${{ github.sha }} $AGENT_ENV
          az containerapp update -n docchat-frontend -g AgenticRAG \
            --image ghcr.io/${{ github.repository }}-frontend:${{ github.sha }}
