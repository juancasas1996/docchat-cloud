services:
  api:
    build: ./api
    ports:
      - "8000:8000"
    environment:
      NVIDIA_API_KEY: ${NVIDIA_API_KEY:-}
      MCP_URL: http://mcp:8080/mcp
    depends_on:
      - mcp

  mcp:
    build: ./mcp
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    ports:
      - "8501:8501"
    environment:
      API_URL: http://api:8000
    depends_on:
      - api
